<div class="notion-section">
    <hr class="notion-divider">
    <h2 id="member-articles">メンバーを知る</h2>
    <p>イタンジで働くメンバーのリアルな声をご覧ください。それぞれのバックグラウンドや働き方、やりがいについて語っています。</p>

    <div class="notion-grid-3">
        {% for article in site.data.member_articles %}
        <a href="{{ article.url }}" target="_blank" rel="noopener noreferrer" class="blog-post-link">
            <div class="notion-card blog-post-card">
                <div class="notion-card-title blog-post-title">{{ article.title }}</div>
                <p class="notion-card-description">{{ article.description }}</p>
                <p class="blog-card-url">shanaiho.itandi.co.jp</p>
            </div>
        </a>
        {% endfor %}
    </div>
</div>
