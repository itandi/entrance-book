services:
  site:
    platform: linux/arm64/v8
    build:
      context: .
      dockerfile: Dockerfile
    image: entrance-book-site:latest
    command: jekyll serve --livereload --force_polling --source /srv/jekyll --destination /srv/jekyll/_site
    ports:
      - "4000:4000"
      - "35729:35729" # LiveReload port
    volumes:
      - .:/srv/jekyll
    environment:
      - JEKYLL_ENV=development
